protocol_version: "1.2"
blueprint_version: "1.8"
schema_version: "d2-experiment.schema.v2"
python_version: "3.12"
development_split: dev
test_split: test
max_plan_steps: 12
max_semantic_calls: 3
max_output_tokens_per_call: 4096
canonical_input_token_cap: 65536
full_call_token_cap: 98304
program_stdout_byte_cap: 1048576
program_stderr_byte_cap: 1048576
sandbox:
  image: "python:3.12.8-slim@sha256:development-pin-required"
  network: none
  read_only_root: true
  no_new_privileges: true
  drop_all_capabilities: true
  user: "65532:65532"
  memory: "256m"
  cpus: 1.0
  pids_limit: 32
  timeout_seconds: 10
budgets:
  transport_retries: 2
  plan_or_code_repairs: 1
  bootstrap_resamples: 10000
  bootstrap_seed: 20261125
metrics: [SGIS, RGFR, RNC, GCP, AHA, CEI]
api_execution:
  enabled_by_default: false
  required_env_flag: AUD_SUD_ALLOW_LIVE_API
  required_cli_flag: --live

