[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aud-sud-d2-experiment"
version = "0.1.0"
description = "Standalone development-phase AUD/SUD D2 LLM comparative experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.10.6",
  "numpy==2.2.3",
  "matplotlib==3.10.0",
  "pytest==8.3.4",
  "openai==1.61.1",
  "google-genai>=1.0.0,<2.0.0",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["ruff==0.9.7"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

